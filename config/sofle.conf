CONFIG_ZMK_KEYBOARD_NAME="Nomad"

# Uncomment the following line to enable the Sofle OLED Display
#CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
#CONFIG_EC11=y
#CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB matrix (zmk-rgb-matrix module); effects are configured in sofle.keymap.
# Cut the LED power rail (without writing to flash) once every LED has been
# dark for a second, e.g. after the heatmap has cooled down or when idle.
CONFIG_KEYPAW_RGB_MATRIX_RAIL_OFF=y
# Always start the RGB effect at power-on, even if RGB_TOG saved "off".
CONFIG_KEYPAW_RGB_MATRIX_FORCE_ON_AT_BOOT=y
# Colour keys (hue/sat/RGB_COLOR_HSB) set one colour shared by all effects.
CONFIG_KEYPAW_RGB_MATRIX_SHARED_COLOR=y
# Check for a reconnected right half every 5 s instead of every second (fewer
# wakeups); its RGB state syncs at most 5 s after a reconnect.
CONFIG_KEYPAW_RGB_SPLIT_SYNC_POLL_MS=5000

# sleep options
CONFIG_ZMK_IDLE_TIMEOUT=15000
CONFIG_ZMK_SLEEP=y
# Deep sleep after 30 min idle (first keypress then only wakes the board)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_EXT_POWER=y

# mouse options
CONFIG_ZMK_POINTING=y

# other options
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_STUDIO=y
